name: Cards do perfil
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # METRICS_TOKEN: PAT classic com escopo "repo", para contar os repos privados
      - run: node scripts/cards.mjs
        env: { GH_TOKEN: "${{ secrets.METRICS_TOKEN }}" }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          git diff --cached --quiet || (git commit -m "Atualiza cards" && git push)
